[project]
name = "ibkr-steuerrechner"
version = "0.1.0"
description = "Zur Berechnung der Steuerschuld von Optionen- und Aktiengeschäften"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "babel==2.18.0",
    "numpy==2.5.4",
    "pandas==3.1.0",
    "python-dateutil==3.0.0",
    "streamlit==1.66.1",
    "xlsxwriter==3.3.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "src",
]

[tool.uv]
required-version = ">=0.11.0"
